name: V4 Archive Cross Exchange Validation

on:
  workflow_dispatch:

  push:
    branches:
      - v4-clean-core

    paths:
      - "v4_archive_cross_validation_trigger.txt"
      - ".github/workflows/v4-archive-cross-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout V4
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Safety Check
        shell: bash
        run: |
          test -f v4_archive_cross_validation.py
          ! grep -Eq '/trade/order|/trade/batchOrders|/order/test|requests\.post' v4_archive_cross_validation.py
          echo "V4 ARCHIVE VALIDATION SAFETY: READ-ONLY PASS"

      - name: Run Archive Cross Exchange Validation
        run: |
          python v4_archive_cross_validation.py

      - name: Show Validation Summary
        if: always()
        run: |
          if [ -f artifacts/v4_archive_cross_validation_summary.json ]; then
            echo "===== V4 ARCHIVE CROSS VALIDATION SUMMARY ====="
            cat artifacts/v4_archive_cross_validation_summary.json
          else
            echo "Validation summary was not generated."
          fi

      - name: Upload Validation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-archive-cross-validation-results
          path: |
            artifacts/v4_archive_cross_validation_summary.json
            artifacts/v4_archive_cross_validation.csv
          if-no-files-found: warn
          retention-days: 30
