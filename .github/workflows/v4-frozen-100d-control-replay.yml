name: V4 Frozen 100D Control Replay

on:
  workflow_dispatch:

  push:
    branches:
      - v4-clean-core
    paths:
      - "v4_frozen_replay_trigger.txt"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read
      actions: read

    env:
      V4_FROZEN_DATASET_DIR: frozen_dataset
      V4_FROZEN_DATASET_ID: V4_CORE6_BINANCE_UM_5M_20260215_20260903_EBECBEDEEE03
      V4_FROZEN_ROOT_SHA256: ebecbedeee03954dc9a8ff5fdabf764ebf92fb8cd90b30a659f8cbeaf9d67965
      REPLAY_SYMBOLS: BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,DOGE-USDT,ZEC-USDT
      REPLAY_DAYS: "100"
      REPLAY_STEP_MIN: "15"
      REPLAY_OUTCOME_HOURS: "24"
      REPLAY_SIGNAL_COOLDOWN_HOURS: "6"

    steps:
      - name: Checkout V4
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Frozen Dataset
        uses: actions/download-artifact@v4
        with:
          name: v4-frozen-core6-200d-dataset
          path: frozen_dataset
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33924848219

      - name: Safety and Syntax Check
        shell: bash
        run: |
          set -euo pipefail
          test -f v4_frozen_replay_harness.mjs
          test -f v4_frozen_data_provider.mjs
          test -f v4_replay_runner.mjs
          test -f v4_execution.js
          test -f frozen_dataset/manifest.json
          test -f frozen_dataset/data/BTC_USDT_5m.csv.gz

          node --check v4_frozen_replay_harness.mjs
          node --check v4_frozen_data_provider.mjs

          ! grep -Eq '/trade/order|/trade/batchOrders|/order/test|requests\.post|method[[:space:]]*=[[:space:]]*["'"'"']POST["'"'"']' v4_frozen_replay_harness.mjs v4_frozen_data_provider.mjs

          echo "V4 FROZEN CONTROL SAFETY: HISTORICAL READ-ONLY PASS"

      - name: Logic Test
        run: |
          node v4_logic_test.mjs

      - name: Run Frozen 100D Control Replay
        run: |
          node v4_frozen_replay_harness.mjs

      - name: Show Replay Summary
        if: always()
        run: |
          if [ -f artifacts/v4_replay_summary.json ]; then
            echo "===== V4 FROZEN 100D CONTROL SUMMARY ====="
            cat artifacts/v4_replay_summary.json
          else
            echo "Replay summary was not generated."
          fi

      - name: Upload Replay Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-frozen-100d-control-replay-results
          path: |
            artifacts/v4_replay_summary.json
            artifacts/v4_replay_signals.json
            artifacts/v4_replay_signals.csv
          if-no-files-found: warn
          retention-days: 30
