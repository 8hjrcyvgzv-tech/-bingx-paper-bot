name: V4 Tiberius Replay Lab

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols"
        required: true
        default: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,DOGE-USDT,ZEC-USDT"

      days:
        description: "Replay days"
        required: true
        default: "30"

      step_minutes:
        description: "Replay step minutes"
        required: true
        default: "15"

      outcome_hours:
        description: "Outcome horizon hours"
        required: true
        default: "24"

  push:
    branches:
      - v4-clean-core
    paths:
      - "v4_replay_trigger.txt"
      - ".github/workflows/v4-replay.yml"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - name: Checkout V4
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Safety Check
        run: |
          grep -q 'realOrdersEnabled: false' worker_v4_clean_core.js
          grep -q 'paperOrdersEnabled: false' worker_v4_clean_core.js
          grep -q 'realOrderPermission: false' worker_v4_clean_core.js
          grep -q 'tradePermission: false' v4_catalyst.js
          echo "V4 REPLAY SAFETY: PASS"

      - name: Deterministic V4 Logic Tests
        run: |
          node v4_logic_test.mjs

      - name: Resolve Replay Config
        shell: bash
        env:
          INPUT_SYMBOLS: ${{ inputs.symbols }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_STEP_MIN: ${{ inputs.step_minutes }}
          INPUT_OUTCOME_HOURS: ${{ inputs.outcome_hours }}
        run: |
          get_cfg() {
            local key="$1"
            if [ ! -f v4_replay_trigger.txt ]; then
              return 0
            fi
            grep -m1 "^${key}=" v4_replay_trigger.txt | cut -d= -f2- || true
          }

          SYMBOLS="${INPUT_SYMBOLS:-$(get_cfg symbols)}"
          DAYS="${INPUT_DAYS:-$(get_cfg days)}"
          STEP_MIN="${INPUT_STEP_MIN:-$(get_cfg step_minutes)}"
          OUTCOME_HOURS="${INPUT_OUTCOME_HOURS:-$(get_cfg outcome_hours)}"
          COOLDOWN_HOURS="$(get_cfg signal_cooldown_hours)"

          SYMBOLS="${SYMBOLS:-BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,DOGE-USDT,ZEC-USDT}"
          DAYS="${DAYS:-30}"
          STEP_MIN="${STEP_MIN:-15}"
          OUTCOME_HOURS="${OUTCOME_HOURS:-24}"
          COOLDOWN_HOURS="${COOLDOWN_HOURS:-6}"

          echo "REPLAY_SYMBOLS=${SYMBOLS}" >> "$GITHUB_ENV"
          echo "REPLAY_DAYS=${DAYS}" >> "$GITHUB_ENV"
          echo "REPLAY_STEP_MIN=${STEP_MIN}" >> "$GITHUB_ENV"
          echo "REPLAY_OUTCOME_HOURS=${OUTCOME_HOURS}" >> "$GITHUB_ENV"
          echo "REPLAY_SIGNAL_COOLDOWN_HOURS=${COOLDOWN_HOURS}" >> "$GITHUB_ENV"

          echo "Replay symbols: ${SYMBOLS}"
          echo "Replay days: ${DAYS}"
          echo "Replay step: ${STEP_MIN}m"
          echo "Outcome horizon: ${OUTCOME_HOURS}h"
          echo "Signal cooldown: ${COOLDOWN_HOURS}h"

      - name: Run Tiberius Replay
        run: |
          node v4_replay_harness_patch.mjs

      - name: Show Replay Summary
        if: always()
        run: |
          if [ -f artifacts/v4_replay_summary.json ]; then
            echo "===== V4 REPLAY SUMMARY ====="
            cat artifacts/v4_replay_summary.json
          else
            echo "Replay summary was not generated."
          fi

      - name: Upload Replay Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-replay-results
          path: |
            artifacts/v4_replay_summary.json
            artifacts/v4_replay_signals.json
            artifacts/v4_replay_signals.csv
          if-no-files-found: warn
          retention-days: 30
